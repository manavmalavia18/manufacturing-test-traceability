name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ManufacturingTraceability.slnx
      - name: Build
        run: dotnet build ManufacturingTraceability.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test ManufacturingTraceability.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
